name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Compilar (Linux x86_64, GTK2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Lazarus e Free Pascal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lazarus-ide lcl-gtk2 lcl-units fpc >/dev/null
          lazbuild --version

      - name: Compilar
        run: lazbuild --widgetset=gtk2 --build-mode=Default jukelinux.lpi

      - name: Conferir o executável
        run: |
          file jukelinux
          ldd jukelinux | grep -i "not found" && exit 1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: jukelinux-linux-x86_64
          path: jukelinux
          if-no-files-found: error
