name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Compilar (Linux x86_64, GTK2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Lazarus e Free Pascal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lazarus-ide lcl-gtk2 lcl-units fpc xvfb xdotool >/dev/null
          lazbuild --version

      # A chave pública das licenças está em src/licenca_publica.inc (ferramentas/licenca/nova_chave.sh).
      # Enquanto for a de desenvolvimento, o executável não serve para as máquinas.
      - name: Chave da licença
        run: |
          if grep -q "NOVA_CHAVE_DESENVOLVIMENTO = True" src/licenca_publica.inc; then
            echo "::warning::src/licenca_publica.inc ainda é a chave de DESENVOLVIMENTO: rode ferramentas/licenca/nova_chave.sh e faça commit da chave pública (não usar este executável nas máquinas)"
          fi

      - name: Testes da nuvem
        working-directory: nuvem
        run: npm test

      - name: Testes (músicas cifradas, licença e conversa com a nuvem)
        run: |
          sh testes/musica/rodar.sh
          sh testes/licenca/rodar.sh
          sh testes/nuvem/rodar.sh

      - name: Compilar
        run: lazbuild --widgetset=gtk2 --build-mode=Default jukelinux.lpi

      - name: Conferir o executável
        run: |
          file jukelinux
          ldd jukelinux | grep -i "not found" && exit 1 || true

      # O de teste confere as licenças com a chave de desenvolvimento, que a nuvem do teste usa para assinar.
      - name: Compilar o executável de teste
        run: lazbuild --widgetset=gtk2 --build-mode=Teste jukelinux.lpi

      - name: Teste de integração (jukebox e nuvem abertas, tela virtual)
        run: sudo -E env "PATH=$PATH" sh testes/integracao/rodar.sh ./jukelinux-teste

      - name: Montar o pacote de instalação
        run: |
          mkdir pacote
          cp jukelinux instalacao/instalar.sh instalacao/pix.txt.exemplo instalacao/LEIA-ME.txt instalacao/baixar-youtube.sh pacote/

      - uses: actions/upload-artifact@v4
        with:
          name: jukelinux-nova-linux-x86_64
          path: pacote/
          if-no-files-found: error
